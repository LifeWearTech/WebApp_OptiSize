
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Browse Products</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">

  <style>
    body {
      --bg-color: #eae6e6;
      background: var(--bg-color);
      font-family: system-ui, sans-serif;
      margin: 0;
      padding: 1rem;
    }

    h2 {
      text-align: center;
      margin: 0 0 1rem 0;
      font-size: 24px;
      font-weight: 700;
    }

    /* =========================
       Product card styling
    ========================= */
    .product-card {
      background: linear-gradient(135deg, #f5f5f5, #dcdcdc);
      border-radius: 15px;
      border: 2px solid #000;
      padding: 14px;
      margin-bottom: 16px;
      width: 100%;
      box-sizing: border-box;
      color: #000;
      cursor: pointer;
    }

    .product-card.selected {
      outline: 3px solid lime;
    }

    .product-image {
      width: 100%;
      max-height: 260px;
      object-fit: contain;
      display: block;
      margin-bottom: 10px;
    }

    .product-title {
      font-size: 18px;
      font-weight: bold;
      font-style: italic;
      margin-bottom: 6px;
    }

    .product-desc-line {
      font-size: 16px;
      margin: 3px 0;
    }

    .product-section-title {
      font-size: 17px;
      font-weight: bold;
      margin-top: 10px;
    }

    .product-size-line,
    .product-vendor {
      font-size: 16px;
      margin: 3px 0;
    }

    /* =========================
       ✅ BUTTON CONTROL
    ========================= */
    :root {
      --continue-bg: #00c896;   /* ✅ editable */
      --continue-text: #ffffff;

      --back-bg: #9d9a9a;       /* ✅ editable */
      --back-text: #ffffff;
    }

    /* ✅ Button row */

.action-row {
  display: none;

  position: fixed;
  bottom: 2rem;
  left: 50%;
  transform: translateX(-50%);

  display: flex;
  justify-content: center;

  max-width: 520px;
  width: 90%;
}


    /* ✅ Shared button style */
    .action-btn {
      flex: 1;
      padding: 1rem;
      font-size: 20px;
      font-weight: bold;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      box-shadow: 0 6px 14px rgba(0,0,0,0.25);
    }

    /* ✅ Continue button */

/* ✅ Continue button */
#continue-btn {
  background: linear-gradient(135deg, var(--continue-bg), #009f75);
  color: var(--continue-text);

  flex: 0 0 280px;
}



  </style>
</head>

<body>

  <!-- Page title -->
  <h2>Select Product</h2>

  <!-- Product list -->
  <main id="products-container" aria-label="Product list"></main>

  <!-- ✅ NEW BUTTON ROW -->
  <div class="action-row" id="action-row">
    <button id="continue-btn" class="action-btn">Continue</button>
  </div>

  <script type="module" src="/js/Android/Android_browse.js"></script>

</body>
</html>
