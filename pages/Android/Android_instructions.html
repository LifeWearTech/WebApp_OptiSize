
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Measurement Instructions</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <style>
    :root {
      padding-top: env(safe-area-inset-top);
    }

    body {
      --bg-color: #eae6e6;

      background: var(--bg-color);

      margin: 0;
      padding: 0;

      font-family: system-ui, sans-serif;

      overflow: hidden;
    }

    /* =========================
       CONTAINER
    ========================= */

    #scroll-container {
      position: absolute;

      top: 0;
      left: 0;
      right: 0;
      bottom: 110px;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 1rem;

      overflow: hidden;
    }

    /* =========================
       CARD
    ========================= */

    .instruction-card {
      display: flex;
      flex-direction: column;

      background: #ffffff;
      color: #111;

      padding: 1rem;

      border-radius: 12px;

      width: 90%;
      max-width: 360px;

      margin: 0 auto;

      max-height: calc(100vh - 180px);

      box-sizing: border-box;

      overflow: hidden;
    }

    /* =========================
       IMAGE
    ========================= */

    .instruction-card img {
      display: block;

      width: 100%;

      max-height: 35%;

      object-fit: contain;

      margin-bottom: 0.5rem;

      flex-shrink: 0;
    }

    /* =========================
       TEXT
    ========================= */

    .instruction-card p {
      font-size: clamp(12px, 2.6vw, 14px);

      margin: 4px 0;

      line-height: 1.3;

      flex: 0 1 auto;
    }

    /* =========================
       MEASURE BUTTON
    ========================= */

    #measure-btn {
      position: fixed;

      bottom: 1.5rem;
      left: 50%;

      transform: translateX(-50%);

      width: 90%;
      max-width: 360px;

      padding: 1rem 2rem;

      font-size: 18px;
      font-weight: bold;
      font-family: inherit;

      background: linear-gradient(135deg, #00c896, #009f75);

      color: white;

      border: none;
      border-radius: 12px;

      box-shadow: 0 6px 14px rgba(0,0,0,0.25);

      cursor: pointer;

      box-sizing: border-box;

      touch-action: manipulation;
      user-select: none;
    }
  </style>
</head>


<body>

  <main id="scroll-container"></main>

  <button id="measure-btn">Measure My Size</button>

  <script type="module" src="/js/Android/Android_instructions.js"></script>

</body>
</html>
