
<!doctype html>
<html lang="en">
<head>
  <!--
    RESULTS PAGE
    - Displays size-based fit results
    - Works for:
        • Browse flow
        • Scan flow
        • Measure-only flow
  -->

  <meta charset="utf-8" />
  <title>Results</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">

  <style>
    body {
     
  --bg-color: #eae6e6;
  background: var(--bg-color);

      color: white;
      font-family: system-ui, sans-serif;
      margin: 0;
      padding: 1rem;
    }

    h2 {
      text-align: center;
      margin: 0 0 1rem 0;
      font-size: 24px;
      font-weight: 700;
      color: black;   /* ✅ ADD THIS LINE */
    }

    /* =========================
       Product card
       ========================= */
    .product-card {
      background: linear-gradient(135deg, #f5f5f5, #dcdcdc);
      border-radius: 15px;
      border: 2px solid black;
      padding: 14px;
      margin-bottom: 16px;
      color: black;
      box-sizing: border-box;
    }

    .product-image {
      width: 100%;
      height: auto;
      max-height: 260px;
      object-fit: contain;
      display: block;
      margin-bottom: 10px;
    }

    .product-title {
      font-size: 18px;
      font-weight: bold;
      font-style: italic;
      margin-bottom: 6px;
    }

    .product-desc-line,
    .product-size-line,
    .product-vendor {
      font-size: 16px;
      margin: 3px 0;
    }

    .product-section-title {
      font-size: 17px;
      font-weight: bold;
      margin-top: 10px;
    }

    /* =========================
       Fit badge
       ========================= */
    .fit-badge {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    /* ✅ RED styling for No-Fit */
    .fit-badge.no-fit {
      color: #ff4d4d;
    }

    .fit-badge.no-fit .fit-check {
      color: #ff4d4d;
    }

    /* =========================
       See Recommendations button
       ========================= */
    button {
      display: block;
      margin: 2rem auto 0 auto;
      padding: 1rem 2rem;
      font-size: 20px;
      font-weight: bold;
      background: linear-gradient(135deg, #00c896, #009f75);
      color: white;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      box-shadow: 0 6px 14px rgba(0,0,0,0.25);
    }
  </style>
</head>

<body>

  <h2>Results</h2>

  <!-- Results rendered by results.js -->
  <div id="results-container"></div>

  <!-- Results logic -->
  <script src="/js/Android/Android_results.js"></script>

</body>
</html>
