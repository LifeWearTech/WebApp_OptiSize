<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contact Us</title>

<style>

body{
    margin:0;
    background:#eae6e6;
    font-family:system-ui,sans-serif;
}

.container{
    padding:60px 16px 30px 16px;
}

.logo{
    text-align:center;
}

.logo img{
    height:100px;
    width:auto;
    max-width:95%;
    object-fit:contain;
    display:block;
    margin:0 auto;
}

.divider{
    margin-top:20px;
    border-top:2px solid #9d0101;
}

.title{
    margin-top:25px;
    margin-bottom:25px;

    color:#9d0101;
    font-size:24px;
    font-weight:bold;
    font-style:italic;

    text-align:center;
}

.contact-row{
    display:flex;
    align-items:center;
    margin-bottom:20px;
}

.icon{
    width:32px;
    min-width:32px;
    font-size:24px;
}

.contact-link{
    margin-left:10px;

    color:black;
    font-size:18px;
    font-weight:bold;
    font-style:italic;

    text-decoration:underline;
    word-break:break-word;
}

.contact-link:hover{
    color:black;
}

/* Home Button */
.home-btn{
    position: fixed;
    top: max(16px, env(safe-area-inset-top));
    right: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 44px;
    height: 44px;
    font-size: 28px;
    text-decoration: none;
    z-index: 1000;
}

</style>
</head>

<body>

<a href="/main_iOS.html" class="home-btn"  aria-label="Home"> 🏠</a>

<div class="container">

    <div class="logo">
        <img src="/assets/icons/MainIcon2.png" alt="Logo">
    </div>

    <div class="divider"></div>

    <div class="title">

    </div>

    <div class="contact-row">
        <span class="icon">📞</span>
        <a class="contact-link" href="tel:954-785-1055">
            954-785-1055
        </a>
    </div>

    <div class="contact-row">
        <span class="icon">🌐</span>
        <a
            class="contact-link"
            href="https://www.lifeweartechnologies.com"
            target="_blank"
            rel="noopener noreferrer">
            www.lifeweartechnologies.com
        </a>
    </div>

    <div class="contact-row">
        <span class="icon">✉️</span>
        <a
            class="contact-link"
            href="mailto:customercare@lifeweartechnologies.com">
            customercare@lifeweartechnologies.com
        </a>
    </div>

</div>

</body>
</html>
