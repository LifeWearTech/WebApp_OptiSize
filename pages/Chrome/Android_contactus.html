
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contact Us</title>

<style>
body{
    margin:0;
    background:#eae6e6;
    font-family:system-ui,sans-serif;
}

.container{
    padding:30px 16px 30px 16px;
}


.logo{
    text-align:center;
}


.logo img{
    height:100px;
    width:auto;
    max-width:95%;
    object-fit:contain;
    display:block;
    margin:0 auto;
}


.divider{
    margin-top:20px;
    border-top:2px solid #9d0101;
}

.title{
    margin-top:25px;
    margin-bottom:25px;

    color:#9d0101;
    font-size:24px;
    font-weight:bold;
    font-style:italic;
}

.contact-row{
    display:flex;
    align-items:center;
    margin-bottom:20px;
}

.icon{
    width:28px;
    min-width:28px;
    color:#9d0101;
    font-size:24px;
}

.contact-link{
    margin-left:10px;

    color:black;
    font-size:18px;
    font-weight:bold;
    font-style:italic;
    text-decoration:underline;
    word-break:break-word;
}

.contact-link:hover{
    color:black;
}


.back{
    position:fixed;
    top:10px;
    right:16px;
    z-index:1000;
}

a{
    color:#2563eb;
    text-decoration:none;
    font-weight:500;
}
</style>

<!-- Material Icons -->
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
</head>

<body>

<div class="container">
    <a href="/" class="back"><span class="material-icons">home</span></a>
    <div class="logo">
        <img src="/assets/icons/MainIcon2.png" alt="Logo">
    </div>

    <div class="divider"></div>

    <div class="title">
    </div>

    <div class="contact-row">
        <span class="material-icons icon">phone</span>
        <a class="contact-link" href="tel:1-800-803-6025">
            1-800-803-6025
        </a>
    </div>

    
<div class="contact-row">
    <span class="material-icons icon">language</span>
    <a class="contact-link"
       href="https://www.lifeweartechnologies.com"
       target="_blank"
       rel="noopener noreferrer">
        www.lifeweartechnologies.com
    </a>
</div>


 
<div class="contact-row">
    <span class="material-icons icon">email</span>
    <a class="contact-link" href="mailto:customercare@lifeweartechnologies.com">
        customercare@lifeweartechnologies.com
    </a>
</div>


</div>

</body>
</html>
