
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Measurement Instructions</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <style>
    :root {
      padding-top: env(safe-area-inset-top);
    }

    body {
      --bg-color: #eae6e6;
      background: var(--bg-color);
      margin: 0;
      padding: 0;
      font-family: system-ui, sans-serif;
      overflow: hidden;
    }

    /* ✅ CONTAINER */
    #scroll-container {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 110px;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 1rem;
      overflow: hidden;
    }

    /* ✅ CARD */
    .instruction-card {
      display: flex;
      flex-direction: column;

      background: #ffffff;
      color: #111;

      padding: 1rem;
      border-radius: 12px;

      width: 90%;
      max-width: 360px;

      margin: 0 auto;
      max-height: calc(100vh - 180px);

      box-sizing: border-box;
      overflow: hidden;
    }

    .instruction-card img {
      width: 100%;
      max-height: 35%;
      object-fit: contain;
      margin-bottom: 0.5rem;
    }

    .instruction-card p {
      font-size: clamp(12px, 2.6vw, 14px);
      margin: 4px 0;
      line-height: 1.3;
    }

    /* ✅ Measure Button */
    #measure-btn {
      position: fixed;
      bottom: calc(1.5rem + env(safe-area-inset-bottom));
      left: 50%;
      transform: translateX(-50%);

      padding: 1rem 2rem;
      font-size: 18px;
      font-weight: bold;

      background: linear-gradient(135deg, #00c896, #009f75);
      color: white;

      border-radius: 12px;
      border: none;
      box-shadow: 0 6px 14px rgba(0,0,0,0.25);
    }

    /* ✅ AR Buttons */
    #exit-ar-btn,
    #exit-ar-hard-btn {
      position: fixed;
      z-index: 99999;

      padding: 0.9rem 1.2rem;
      font-size: 16px;
      font-weight: 600;

      border-radius: 10px;
      border: none;

      cursor: pointer;
      display: none; /* initially hidden */
    }

    /* Product Recommendation */
    #exit-ar-btn {
      bottom: calc(1.5rem + env(safe-area-inset-bottom));
      right: 1rem;
      background: #2563eb;
      color: white;
    }

    /* Exit AR */
    #exit-ar-hard-btn {
      bottom: calc(1.5rem + env(safe-area-inset-bottom));
      left: 1rem;
      background: #ef4444;
      color: white;
    }
  </style>
</head>

<body>

  <main id="scroll-container"></main>

  <button id="measure-btn">Measure My Size</button>

  <!-- ✅ ✅ MOVED INSIDE BODY (CRITICAL FIX) -->
  <button id="exit-ar-btn">Product Recommendation</button>
  <button id="exit-ar-hard-btn">Exit AR</button>

  <!-- ✅ XR LIBRARIES -->
  <!--script src="https://unpkg.com/three@0.128.0/build/three.min.js"></script !-->
  <script src="/libs/three.min.js"></script>
  <script src="/xr8/xr.js" data-preload-chunks="slam"></script>
  <!-- script src="https://cdn.8thwall.com/web/xrextras/xrextras.js"></script !-->
   <script src="/libs/xrextras.js"></script>
  <!-- ✅ DYNAMIC XR SCRIPT LOADING -->
  <script>
    const params = new URLSearchParams(window.location.search);
    const productType = params.get("p") || "Knee"; /* ✅ fallback added */

    let script = document.createElement("script");

    if (productType === "Ankle") {
      script.src = "/js/iOS/iOS_mainAnkle.js";
    } else {
      script.src = "/js/iOS/iOS_mainKnee.js";
    }

    document.body.appendChild(script);
  </script>

  <!-- ✅ INSTRUCTIONS LOGIC -->
  <script type="module" src="/js/iOS/iOS_instructions.js"></script>

</body>
</html>
