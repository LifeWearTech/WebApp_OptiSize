
<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <title>Product Selection</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <style>
    /* =========================================
       🌍 GLOBAL UI SYSTEM
    ========================================= */
    body {
      margin: 0;

      /* 📏 BUTTON SIZE */
      --btn-width: 100%;
      --btn-heiaght: 64px;

      /* 🎨 BACKGROUND */
      --bg-color: #eae6e6;
      --text-color: #131313;

      /* 🏷️ TITLE */
      --title-color: #090909;
      --title-size: 22px;
      --title-weight: 700;

      /* 🔘 MAIN BUTTONS */
      --btn-font-size: 20px;
      --btn-padding-x: 1.3rem;
      --btn-radius: 14px;
      --btn-text-color: #efebeb;

      --btn-color-top: #E4002B;
      --btn-color-bottom: #E4002B;

      /* 🎯 ICONS */
      --icon-size: 28px;
      --icon-width: 40px;

      /* 📐 SPACING */
      --btn-spacing: 1.1rem;

      /* 🔻 ACTION BUTTONS (BOTTOM) */
      --action-btn-font-size: 18px;
      --action-btn-height: 56px;
      --action-btn-radius: 12px;

      --continue-color: #16a34a;
      --continue-disabled: #6b7280;
      --rescan-color: #9a9999;

      --action-btn-text: #ffffff;

      background: var(--bg-color);
      color: var(--text-color);
      font-family: system-ui, sans-serif;
      text-align: center;
    }

    /* TITLE */
    h1 {
      font-size: var(--title-size);
      color: var(--title-color);
      font-weight: var(--title-weight);
      margin-bottom: 10px;
    }

    /* CONTAINER */
    #product-select-wrapper {
      position: fixed;
      top: 45%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 80%;
      max-width: 420px;
    }

    /* DROPDOWN */
    select {
      padding: 1rem;
      width: 100%;
      font-size: 20px;
      border-radius: 10px;
      border: none;
      margin-bottom: 1.2rem;
      background: #ffffff;
      color: #111;
    }

    /* MAIN BUTTONS */
    .main-btn {
      display: flex;
      align-items: center;
      margin-left: auto;
      margin-right: auto;

      padding: 0 var(--btn-padding-x);
      font-size: var(--btn-font-size);
      font-weight: 600;

      border-radius: var(--btn-radius);
      border: none;

      background: linear-gradient(
        180deg,
        var(--btn-color-top),
        var(--btn-color-bottom)
      );

      color: var(--btn-text-color);

      cursor: pointer;
      margin-top: var(--btn-spacing);

      width: var(--btn-width);
      height: var(--btn-height);

      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.25);
    }

    .btn-icon {
      width: var(--icon-width);
      margin-right: 12px;
      font-size: var(--icon-size);
      text-align: center;
      flex-shrink: 0;
    }

    .main-btn span:last-child {
      flex: 1;
      text-align: left;
    }

    /* SCANNER */
    #scanner-overlay {
      position: fixed;
      inset: 0;
      background: black;
      z-index: 10000;
      display: none;
      justify-content: center;
      align-items: center;
    }

    video {
      width: 100%;
      max-width: 480px;
      border-radius: 12px;
    }

    #barcode-guide {
      position: absolute;
      width: 80vw;
      max-width: 420px;
      height: 22vh;
      border: 3px solid #ff2d2d;
      border-radius: 12px;
      pointer-events: none;
      box-shadow:
        0 0 0 9999px rgba(0, 0, 0, 0.45),
        0 0 12px rgba(255, 45, 45, 0.85);
    }

    /* SCAN RESULT */
    #scan-result {
      display: none;
      min-height: 100vh;
      padding: 1rem;
      padding-bottom: 3.5rem;
    }

    .product-card {
      background: linear-gradient(135deg, #f5f5f5, #dcdcdc);
      color: black;
      border-radius: 15px;
      border: 2px solid black;
      padding: 14px;
      margin-bottom: 16px;
      text-align: left;
    }

    .product-image {
      width: 100%;
      max-height: 260px;
      object-fit: contain;
      margin-bottom: 10px;
    }

    .product-title {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 3px;
    }

    /* REMOVE GREEN OUTLINE */
    .selected-tile {
      outline: none;
    }

    /* ACTION BAR */
    .action-bar {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;

      padding: 0.9rem;
      display: flex;
      gap: 0.8rem;
      justify-content: center;

      background: var(--bg-color);
      flex-wrap: wrap;
    }

    /* ACTION BUTTONS */
    .action-btn {
      flex: 1;
      min-width: 120px;
      max-width: 240px;

      height: var(--action-btn-height);

      font-size: var(--action-btn-font-size);
      font-weight: 600;

      border-radius: var(--action-btn-radius);
      border: none;

      color: var(--action-btn-text);
      cursor: pointer;

      display: flex;
      align-items: center;
      justify-content: center;
    }

    #continue-btn {
      background: var(--continue-disabled);
      cursor: not-allowed;
    }

    #continue-btn.enabled {
      background: linear-gradient(135deg, #22c55e, #15803d);
      cursor: pointer;
    }

    #rescan-btn {
      background: var(--rescan-color);
    }

/* ✅ Header row (title + back button) */
.scan-header {
  display: flex;
  justify-content: space-between;  /* ✅ pushes items apart */
  align-items: center;             /* ✅ vertical alignment */

  margin-bottom: 10px;
}

/* ✅ Title (left aligned now) */
.scan-header h2 {
  margin: 0;              /* ✅ removes default spacing */
  font-size: 18px;
  text-align: left;       /* ✅ force left */
}

/* ✅ Back button (right side) */
.back-btn {
  font-size: 18px;
  font-weight: 600;

  color: #2563eb;
  text-decoration: none;

  white-space: nowrap; /* ✅ prevents wrapping */
}


  </style>
</head>

<body>

  <main id="product-select-wrapper">
    <h1>Select Product Type</h1>

    <select id="product-select">
      <option value="Knee">Knee</option>
      <option value="Ankle">Ankle</option>
    </select>

    <button class="main-btn" id="measure-btn">
      <span class="btn-icon">📏</span>
      <span>Measure Size</span>
    </button>

    <button class="main-btn" id="browse-btn">
      <span class="btn-icon">🛍️</span>
      <span>Browse Products</span>
    </button>

    <button class="main-btn" id="scan-btn">
      <span class="btn-icon">📷</span>
      <span>Scan Barcode</span>
    </button>

    <button class="main-btn" id="privacy-btn">
      <span class="btn-icon">📄</span>
      <span>Privacy Policy</span>
    </button>

    <button class="main-btn" id="terms-btn">
      <span class="btn-icon">📑</span>
      <span>Terms & Conditions</span>
    </button>
  </main>

  <div id="scanner-overlay">
    <video id="video" autoplay playsinline></video>
    <div id="barcode-guide"></div>
  </div>

  <section id="scan-result">
    
<!-- ✅ NEW BACK BUTTON -->
    
<div class="scan-header">
  <h2>Scanned Product</h2>
  <a href="/main_android.html" class="back-btn">← Back</a>
</div>

    <div id="products-container"></div>

    <div class="action-bar">
      <button id="rescan-btn" class="action-btn">Rescan</button>
      <button id="continue-btn" class="action-btn">Continue</button>
    </div>
  </section>

  <script>
    document.addEventListener("DOMContentLoaded", () => {

      const home = document.getElementById("product-select-wrapper");
      const overlay = document.getElementById("scanner-overlay");
      const results = document.getElementById("scan-result");
      const video = document.getElementById("video");

      const scanBtn = document.getElementById("scan-btn");
      const rescanBtn = document.getElementById("rescan-btn");
      const continueBtn = document.getElementById("continue-btn");
      const container = document.getElementById("products-container");
      const productSelect = document.getElementById("product-select");

      let stream = null;
      let detector = null;
      let scanning = false;
      let selectedProduct = null;

      /* ---------- Navigation ---------- */

      document.getElementById("measure-btn").onclick = () =>
        location.href = `/pages/Android/Android_instructions.html?p=${productSelect.value}`;

      document.getElementById("browse-btn").onclick = () =>
        location.href = `/pages/Android/Android_browse.html?type=${productSelect.value}`;

      document.getElementById("privacy-btn").onclick = () =>
        location.href = `/pages/Android/Android_privacy.html`;

      document.getElementById("terms-btn").onclick = () =>
        location.href = `/pages/Android/Android_terms.html`;

      /* ---------- Scanner (ANDROID ONLY) ---------- */

      async function startScanner() {
        detector = new BarcodeDetector({
          formats: ["ean_13", "upc_a", "code_128"]
        });

        stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: "environment" }
        });

        video.srcObject = stream;
        await video.play();

        scanning = true;
        home.style.display = "none";
        results.style.display = "none";
        overlay.style.display = "flex";

        requestAnimationFrame(scanLoop);
      }

      function stopScanner() {
        scanning = false;
        overlay.style.display = "none";

        if (stream) {
          stream.getTracks().forEach(t => t.stop());
          stream = null;
        }
      }

      async function scanLoop() {
        if (!scanning) return;

        const codes = await detector.detect(video);
        if (codes.length) {
          stopScanner();
          showProduct(codes[0].rawValue);
          return;
        }

        requestAnimationFrame(scanLoop);
      }

      scanBtn.onclick = () => startScanner();
      rescanBtn.onclick = () => startScanner();

      /* ---------- Product ---------- */

      function normalize(code) {
        let d = String(code).replace(/\D/g, "");
        if (d.length === 13 && d.startsWith("0")) d = d.slice(1);
        return d;
      }

      async function showProduct(barcode) {
        container.innerHTML = "";
        continueBtn.classList.remove("enabled");
        selectedProduct = null;

        const res = await fetch("/assets/ProductData/ProductsJsonFile.json");
        const products = await res.json();

        const scanned = normalize(barcode);
        const p = products.find(x => !x.obsolete && normalize(x.id) === scanned);

        if (!p) {
          container.textContent = "Product not found.";
          results.style.display = "block";
          return;
        }

        const card = document.createElement("div");
        card.className = "product-card";

        const img = document.createElement("img");
        img.className = "product-image";
        img.src = p.image;
        card.appendChild(img);

        const title = document.createElement("div");
        title.className = "product-title";
        title.textContent = p.name;
        card.appendChild(title);

        card.innerHTML += p.desc.map(d =>
          `<div class="product-desc-line">• ${d}</div>`
        ).join("");


        // ✅ Sizes
        const sizeTitle = document.createElement("div");
        sizeTitle.className = "product-section-title";
        sizeTitle.innerHTML = "<strong>Sizes</strong>";
        card.appendChild(sizeTitle);

        if (Array.isArray(p.sizes) && p.sizes.length > 0) {
          p.sizes.forEach(s => {
            const sizeLine = document.createElement("div");
            sizeLine.className = "product-size-line";
            sizeLine.textContent = "• " + s;
            card.appendChild(sizeLine);
          });
        } else {
          const sizeLine = document.createElement("div");
          sizeLine.className = "product-size-line";
          sizeLine.textContent = "Sizes not available";
          card.appendChild(sizeLine);
        }

        // ✅ Retail (bold label only)
        const vendor = document.createElement("div");
        vendor.className = "product-vendor";
        vendor.innerHTML =
          "<strong>Retail:</strong> " + (p.Retail || "Not available");

        card.appendChild(vendor);

        card.onclick = () => {
          document.querySelectorAll(".product-card")
            .forEach(c => c.classList.remove("selected-tile"));
          card.classList.add("selected-tile");
          selectedProduct = p;
          continueBtn.classList.add("enabled");
        };

        
// ✅ Auto-select scanned product
selectedProduct = p;
card.classList.add("selected-tile");
continueBtn.classList.add("enabled");

// ✅ Render UI
container.appendChild(card);
results.style.display = "block";

      }

      continueBtn.onclick = () => {
        if (!selectedProduct) return;
        location.href =
          "/pages/Android/Android_instructions.html?p=" +
          encodeURIComponent(selectedProduct.product_type) +
          "&prod=" + encodeURIComponent(selectedProduct.id);
      };

    });
  </script>

</body>

</html>
