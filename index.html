<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Redirecting...</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <script>
    (function () {

      function isIOSSafari() {
        const ua = navigator.userAgent;

        const isIOS =
          /iPad|iPhone|iPod/.test(ua) ||
          (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);

        const isSafari =
          ua.includes("Safari") &&
          !ua.includes("CriOS") &&
          !ua.includes("FxiOS") &&
          !ua.includes("EdgiOS");

        return isIOS && isSafari;
      }

      const ua = navigator.userAgent;

      // iPhone/iPad Safari
      if (isIOSSafari()) {
        window.location.replace("/main_iOS.html");
        return;
      }

      // Android browsers
      const isAndroid = /Android/i.test(ua);

      if (isAndroid) {
        if (ua.includes("SamsungBrowser")) {
          window.location.replace("/main_SamsungInternet.html");
        }
        else if (ua.includes("EdgA")) {
          window.location.replace("/main_Edge.html");
        }
else if (ua.includes("Chrome")) {
  window.location.replace("/main_Chrome.html");
}
        else {
          document.addEventListener("DOMContentLoaded", () => {
            document.body.innerHTML =
              '<p style="text-align:center;color:red;margin-top:20%;font-family:sans-serif;">Browser not supported</p>';
          });
        }
        return;
      }

      // Anything not iOS Safari or Android
      document.addEventListener("DOMContentLoaded", () => {
        document.body.innerHTML =
          '<p style="text-align:center;color:red;margin-top:20%;font-family:sans-serif;">Browser not supported</p>';
      });

    })();
  </script>
</head>

<body>
  <p style="text-align:center; color:#999; margin-top:20%;">
    Redirecting to experience...
  </p>
</body>
</html>
