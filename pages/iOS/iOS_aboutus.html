<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>About Us</title>

<style>

body{
    margin:0;
    background:#eae6e6;
    font-family:system-ui,sans-serif;
}

.container{
    padding:50px 16px 30px 16px;
}

.logo{
    text-align:center;
}

.logo img{
    height:100px;
    width:auto;
    max-width:95%;
    object-fit:contain;
    display:block;
    margin:0 auto;
}

.divider{
    margin-top:20px;
    border-top:2px solid #9d0101;
}


.info-row{
    display:flex;
    align-items:center;
    margin-bottom:20px;
}

.icon{
    width:32px;
    min-width:32px;
    font-size:24px;
}

.info-text{
    margin-left:10px;
    font-size:20px;
    font-weight:bold;
}

.label{
    color:#9d0101;
    font-weight:bold;
}

.value{
    color:black;
    font-weight:bold;
}

/* Home Button */
.home-btn{
    position: fixed;
    top: max(16px, env(safe-area-inset-top));
    right: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 44px;
    height: 44px;
    font-size: 28px;
    text-decoration: none;
    z-index: 1000;
}

</style>
</head>

<body>

<a href="/main_iOS.html" class="home-btn"  aria-label="Home"> 🏠</a>

<div class="container">

    <div class="logo">
        <img src="/assets/icons/MainIcon2.png" alt="Logo">
    </div>

    <div class="divider"></div>

    <div class="info-row">
        <span class="icon">ℹ️</span>
        <div class="info-text">
            <span class="label">Version:</span>
            <span class="value"> 1.0.0</span>
        </div>
    </div>

    <div class="info-row">
        <span class="icon">©</span>
        <div class="info-text">
            <span class="label">Copyright:</span>
            <span class="value">@: Life Wear Technologies</span>
        </div>
    </div>

</div>

</body>
</html>
